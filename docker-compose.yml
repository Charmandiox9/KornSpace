services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_WS_URL: ${NEXT_PUBLIC_API_WS_URL:-}
    environment:
      API_PROXY_TARGET: http://backend:3000
    expose:
      - "3001"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Define DATABASE_URL_UNPOOLED en .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost/api/auth/google/callback}
      FRONTEND_ORIGIN: http://localhost
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: kornspace-files
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/kornspace-file-processing
      FILE_ASYNC_THRESHOLD_BYTES: 10485760
      FILE_MAX_SIZE_BYTES: 104857600
    working_dir: /workspace/backend
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack_data:/var/lib/localstack
    ports:
      - "4566:4566"
    expose:
      - "4566"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  terraform:
    image: hashicorp/terraform:1.12.2
    working_dir: /infra
    entrypoint: ["/bin/sh", "-c"]
    command: ["terraform init -input=false && terraform apply -input=false -auto-approve"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_localstack_endpoint: http://localstack:4566
    volumes:
      - ./infra/terraform/localstack:/infra
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  localstack_data:
